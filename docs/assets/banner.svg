<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">PulseWatch</title>
  <desc id="desc">PulseWatch — Linux-first system telemetry, delivered as an API.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.32" stop-color="#22d3ee"/>
      <stop offset="0.72" stop-color="#34d399"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <ellipse cx="1070" cy="52" rx="270" ry="180" fill="url(#halo)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="96" fill="#67e8f9" font-size="14" font-weight="600" letter-spacing="4">HOST TELEMETRY / API</text>
    <text x="66" y="166" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">PulseWatch</text>
    <text x="72" y="207" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Linux-first system telemetry, delivered as an API.</text>

    <g transform="translate(70 265)">
      <rect x="0" y="-17" width="94" height="30" rx="15" fill="#0f766e" fill-opacity="0.22" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="47" y="3" fill="#5eead4" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">PYTHON</text>
      <rect x="104" y="-17" width="88" height="30" rx="15" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="148" y="3" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">FASTAPI</text>
      <rect x="202" y="-17" width="84" height="30" rx="15" fill="#4338ca" fill-opacity="0.18" stroke="#818cf8" stroke-opacity="0.35"/>
      <text x="244" y="3" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">PSUTIL</text>
      <rect x="296" y="-17" width="92" height="30" rx="15" fill="#334155" fill-opacity="0.4" stroke="#94a3b8" stroke-opacity="0.25"/>
      <text x="342" y="3" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">SYSTEMD</text>
    </g>
  </g>

  <g opacity="0.9">
    <path d="M650 243 H1140" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <path d="M650 243 H826 L854 243 L880 196 L908 288 L936 219 L956 243 H1140" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="956" cy="243" r="5" fill="#34d399"/>
    <circle cx="956" cy="243" r="12" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>
    <text x="1140" y="278" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end" letter-spacing="2">v0.1.0 · LIVE</text>
  </g>
</svg>
