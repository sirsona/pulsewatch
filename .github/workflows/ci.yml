name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulsewatch
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: pulsewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsewatch -d pulsewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PULSEWATCH_DATABASE_URL: postgresql+asyncpg://pulsewatch:pulsewatch@127.0.0.1:5432/pulsewatch
      PULSEWATCH_TEST_DATABASE_URL: postgresql+asyncpg://pulsewatch:pulsewatch@127.0.0.1:5432/pulsewatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Verify systemd unit
        run: ./scripts/verify-systemd-unit.sh

      - name: Run database migrations
        run: uv run pulsewatch-migrate

      - name: Test with coverage
        run: uv run pytest

      - name: Verify integration-test target
        run: make test-integration

      - name: Build distributions
        run: uv build

      - name: Verify installed wheel and migrations
        run: |
          uv venv /tmp/pulsewatch-wheel --python 3.12
          uv pip install --python /tmp/pulsewatch-wheel/bin/python dist/*.whl
          /tmp/pulsewatch-wheel/bin/pulsewatch --version
          /tmp/pulsewatch-wheel/bin/pulsewatch-migrate
          /tmp/pulsewatch-wheel/bin/python -c 'from pulsewatch.migrate import migration_scripts_path; p = migration_scripts_path(); assert (p / "env.py").is_file(); print(f"packaged migrations: {p}")'

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulsewatch
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: pulsewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsewatch -d pulsewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PULSEWATCH_DATABASE_URL: postgresql+asyncpg://pulsewatch:pulsewatch@127.0.0.1:5432/pulsewatch
      PULSEWATCH_TEST_DATABASE_URL: postgresql+asyncpg://pulsewatch:pulsewatch@127.0.0.1:5432/pulsewatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run database migrations
        run: uv run --python ${{ matrix.python-version }} pulsewatch-migrate

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  container:
    name: Container stack
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: pulsewatch:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the API and PostgreSQL
        run: docker compose up --detach --no-build

      - name: Verify migrated, sampled, ready stack
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/tmp/ready.json; then
              echo "Stack became ready after ${attempt}s"
              cat /tmp/ready.json
              curl --fail --silent http://127.0.0.1:8000/api/v1/metrics/current >/tmp/current.json
              curl --fail --silent 'http://127.0.0.1:8000/api/v1/metrics/history?limit=1' >/tmp/history.json
              python3 -c 'import json; ready=json.load(open("/tmp/ready.json")); current=json.load(open("/tmp/current.json")); history=json.load(open("/tmp/history.json")); assert ready["checks"] == {"database": "ok", "sampler": "ok"}; assert current["hostname"]; assert current["cpu"]["logical_cores"] >= 1; assert history["count"] == 1; print("Migrated database, sampler, current, and history endpoints verified")'
              exit 0
            fi
            sleep 1
          done
          echo "Stack did not become ready within 60s" >&2
          docker compose logs --no-color >&2
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
